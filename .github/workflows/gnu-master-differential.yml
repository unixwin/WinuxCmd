name: GNU master differential

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  # GNU coreutils master, audited 2026-09-16. Advance deliberately with results.
  GNU_REVISION: 5f6c02d3447ee97c7fa02f5d0d6d6e46a8a1ceef

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install GNU build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint bison gettext gperf texinfo libgmp-dev
      # Oracle source policy (DOCS/gate-oracle-policy.md): three transports
      # with a revision anchor. gnulib used to be fetched by
      # `git submodule update` straight from git.savannah.gnu.org, which
      # intermittently aborts mid-packfile with HTTP 500
      #   fatal: Fetched in submodule path 'gnulib', but it did not contain <sha>
      # and reds the whole differential leg (compare is then skipped). The
      # fetch script tries savannah -> GitHub mirror -> cgit snapshot ->
      # the vendored archive in rust2/gate/vendor/, retries transport errors
      # with a bounded backoff, and refuses any source whose revision or tree
      # fingerprint does not match rust2/gate/vendor/gnulib.anchor.json.
      #
      # Adjudication: a red oracle step may be excused manually ONLY when the
      # failure is transport/upstream-build, the provenance artifact shows
      # which source was attempted, and the anchored revision is unchanged.
      # A mismatch in `compare`, a corpus/revision mismatch, or a tree
      # fingerprint mismatch is never adjudicable. Never reuse an oracle
      # record whose revision/cases_sha256 do not match this checkout
      # (DOCS/2.0-HANDOVER.md, gate01 stale-result lesson).
      - name: Build the pinned GNU master source
        run: |
          set -euo pipefail
          # A failed fetch must abort the step: `eval "$(cmd)"` would mask the
          # command substitution's exit status and carry on without
          # GNULIB_SRCDIR. Materialize the env file instead.
          bash tests/differential/fetch-gnu-master.sh "$RUNNER_TEMP/coreutils" \
            > "$RUNNER_TEMP/gnu-oracle-env.sh"
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/gnu-oracle-env.sh"
          test "$COREUTILS_REVISION" = "$GNU_REVISION" || {
            echo "::error::fetched coreutils $COREUTILS_REVISION != workflow GNU_REVISION $GNU_REVISION"
            exit 1
          }
          ls -l "$RUNNER_TEMP/gnu-master-sources.json"
          cd "$RUNNER_TEMP/coreutils"
          git rev-parse HEAD
          echo "GNULIB_SRCDIR=$GNULIB_SRCDIR"
          ./bootstrap --skip-po
          ./configure --disable-nls --disable-dependency-tracking
          # The default target generates gnulib BUILT_SOURCES before compiling.
          make -j2
      - name: Record GNU byte-level results
        run: |
          cp "$RUNNER_TEMP/gnu-master-sources.json" gnu-master-sources.json
          python3 tests/differential/master-oracle.py --gnu-bin "$RUNNER_TEMP/coreutils/src" --revision "$GNU_REVISION" --record gnu-master-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: gnu-master-results
          path: |
            gnu-master-results.json
            gnu-master-sources.json
          if-no-files-found: error

  compare:
    needs: oracle
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: gnu-master-results
      - name: Build native Windows Release
        shell: pwsh
        run: |
          ./scripts/build-with-vs.ps1 -Configuration Release -Target winuxcmd -CMakeExtraArgs @('-DBUILD_MODE=RELEASE', '-DENABLE_TESTS=OFF', '-DCMAKE_CXX_MODULE_STD=ON')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare stdout, stderr and exit status
        shell: pwsh
        run: |
          python tests/differential/master-oracle.py --winuxcmd build-vs/winuxcmd.exe --revision "$env:GNU_REVISION" --compare gnu-master-results.json

  baseline-growth:
    # Only-grows gate for the ledger itself (issue #1127 P3):
    # check-baseline-growth.py compares the baseline.json in this change
    # against the base revision's and fails on a dropped case, a worsened
    # recorded bucket, or a shrunken recorded PASS count. update-baseline.py
    # re-records whatever a run produced, so without this gate a bad run
    # could be committed as the new ledger and lower the bar silently.
    #
    # This is deliberately a separate, static job: it runs no corpus
    # case, so it cannot false-red on live-run noise (the corpus has a
    # case that is red on main in the live shape; in the ledger files it
    # is identical on both sides and compares equal) and it needs no
    # WSL setup, build, or cache, so WSL/cache infrastructure failures
    # cannot fail it either.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fail if baseline.json shrank against the base revision
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          OLD="$RUNNER_TEMP/baseline-old.json"
          if [ -n "$BASE" ] && git show "$BASE:tests/differential/baseline.json" > "$OLD" 2>/dev/null; then
            python3 tests/differential/check-baseline-growth.py "$OLD" tests/differential/baseline.json
          else
            echo "no baseline.json at base revision; nothing to grow from"
          fi

  baseline:
    # tests/differential/baseline.json is the only-grows ledger for the
    # corpus runner: with --results, runner.sh ends by running
    # compare-baseline.py, which fails the run on missing cases, unrecorded
    # new cases, unexplained skips and bucket regressions. Until now no
    # workflow ran the runner, so the gate existed only on maintainer
    # machines. The runner needs a live Linux GNU oracle with the Windows
    # build reachable - the environment the corpus and baseline were
    # recorded in - so it runs inside WSL on the Windows runner.
    # Ubuntu 24.04 ships coreutils 9.4, the recorded oracle; an older
    # distro would SKIP the oracle_version >= 9.2 cases and trip the
    # gate's unexplained-skip rule. GNU_BIN=/usr/bin is load-bearing:
    # it anchors every oracle resolution to this recorded tree (issue
    # #1478); without it the runner drops to ungoverned host-PATH
    # resolution, warns loudly, and records every verdict in the report
    # as host-resolved instead of tree-resolved.
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Build native Windows Release
        shell: pwsh
        run: |
          ./scripts/build-with-vs.ps1 -Configuration Release -Target winuxcmd -CMakeExtraArgs @('-DBUILD_MODE=RELEASE', '-DENABLE_TESTS=OFF', '-DCMAKE_CXX_MODULE_STD=ON')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up WSL with the recorded GNU oracle (Ubuntu 24.04)
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-24.04
          # python3 runs compare-baseline.py. The stock WSL image also
          # lacks cal (provided by ncal) and the bsdextrautils tools.
          additional-packages: python3 bsdextrautils ncal
      - name: Run the differential corpus and the baseline gate
        shell: pwsh
        run: |
          wsl -d Ubuntu-24.04 --cd $env:GITHUB_WORKSPACE -- env WINUXCMD_BIN=build-vs GNU_BIN=/usr/bin bash tests/differential/runner.sh --results baseline-results.tsv --report baseline-report.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload baseline run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: differential-baseline
          path: |
            baseline-results.tsv
            baseline-report.md
          if-no-files-found: warn
