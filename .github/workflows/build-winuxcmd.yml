name: CMake Windows Multi-Arch CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  # Manual re-runs: push events occasionally fail to fan out (observed on
  # PR #1547, where a second push produced no runs at all), and this
  # workflow carries the i18n-drift gate that a branch update must be able
  # to re-verify without a no-op commit.
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned Rust toolchain for the rust2 command library (#1488). Matches the
  # windows-2025 runner image today, so the pin costs no extra download; when
  # the image moves past it, rustup installs exactly this version once and
  # all four legs stay reproducible instead of drifting with image updates.
  RUST2_TOOLCHAIN: "1.99.1"

jobs:
  build-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        # Two editions per architecture (#1438): `default` strips the
        # shell-builtin shadow entry links (kill/test/[/true/false/env/time,
        # see src/core/package_edition.h), `full` materializes every
        # registered entry under a "-full" asset name and is NOT indexed in
        # wpm. Tests and PGO run on the default x64 job only - the editions
        # share the command implementations, and the full job exists for the
        # entry-set difference.
        include:
          - arch: x64
            vcvars_arg: x64
            package_arch: x64
            edition: default
          - arch: x64
            vcvars_arg: x64
            package_arch: x64
            edition: full
          - arch: arm64
            vcvars_arg: x64_arm64
            package_arch: arm64
            edition: default
          - arch: arm64
            vcvars_arg: x64_arm64
            package_arch: arm64
            edition: full

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # winx#1590: run-gate.sh was a syntax error on master (missing `done`,
      # POSIX_MODE guard dropped) and no workflow ever executed it, so the
      # defect lurked. Parse-check the gate script on every leg so a future
      # bad restore fails CI instead of silently shipping an unrunnable gate.
      - name: Check gate shell scripts parse
        shell: bash
        run: |
          bash -n rust2/gate/run-gate.sh

      - name: Extract Version
        id: extract_version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match "^refs/tags/v(\d+\.\d+\.\d+)") {
            $version = $matches[1]
          } else {
            $version = (Select-String -Path "CMakeLists.txt" -Pattern "VERSION (\d+\.\d+\.\d+)").Matches.Groups[1].Value
          }
          echo "project_version=$version" >> $env:GITHUB_OUTPUT

      - name: Locate Visual Studio toolchain
        id: locate_vcvars
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $vcvarsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Auxiliary\Build\vcvarsall.bat" |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($vcvarsPath)) {
            throw "Failed to locate vcvarsall.bat via vswhere"
          }

          "vcvars_path=$vcvarsPath" >> $env:GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # Rust toolchain for the rust2 command library (#1488). A build WITH
      # Rust is the first-class product: WINUXCMD_ENABLE_RUST2 defaults ON
      # when cargo is found, and the replaced commands (currently
      # true;false) are dropped from the build when it is OFF - there is no
      # C++ fallback to degrade to (#1550: replaced commands are never
      # dual-tracked). CI therefore pins the toolchain and installs BOTH
      # MSVC targets on EVERY leg (not arm64-only): cargo must build the
      # staticlib with --target for the C++ target arch (#1552, and the
      # LNK2001 arm64 failures of run 42581933801), and the aarch64 std
      # library is not part of the runner image's default installation.
      # The x64 and arm64 applet sets can never be allowed to diverge.
      # ------------------------------------------------------------------
      # The pin installs under its own rustup slot (1.99.1-...), separate
      # from the image's `stable` alias - cache it so only the first leg
      # ever downloads it; later legs (and future runs) restore it with
      # the aarch64 std library already inside.
      - name: Cache pinned rust2 toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/1.99.1-x86_64-pc-windows-msvc
          key: rustup-toolchain-${{ runner.os }}-${{ env.RUST2_TOOLCHAIN }}-msvc

      - name: Set up pinned Rust toolchain (rust2)
        shell: cmd
        run: |
          "%USERPROFILE%\.cargo\bin\rustup.exe" toolchain install %RUST2_TOOLCHAIN% --profile minimal --no-self-update
          "%USERPROFILE%\.cargo\bin\rustup.exe" default %RUST2_TOOLCHAIN%
          "%USERPROFILE%\.cargo\bin\rustup.exe" target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          "%USERPROFILE%\.cargo\bin\rustup.exe" show

      # The rust2 workspace has zero external crates (std only), so the
      # registry/git cache is pure hygiene (and future-proofs the day a
      # dependency lands). The per-tree rust2-target dirs are deliberately
      # NOT cached: a fresh checkout changes source mtimes, so cargo
      # recompiles the three crates from scratch every run and caching
      # would only upload dead weight.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-rust2-${{ runner.os }}-${{ env.RUST2_TOOLCHAIN }}-${{ hashFiles('rust2/Cargo.lock', 'rust2/crates/*/Cargo.toml') }}

      - name: Configure CMake (Release Mode)
        shell: cmd
        run: |
          call "${{ steps.locate_vcvars.outputs.vcvars_path }}" ${{ matrix.vcvars_arg }}
          cmake -B build-${{ matrix.package_arch }} ^
            -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER_TARGET=${{ matrix.arch }} ^
            -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.arch }} ^
            -DWINUXCMD_PACKAGE_ARCH=${{ matrix.package_arch }} ^
            -DWINUXCMD_PACKAGE_EDITION=${{ matrix.edition }} ^
            -DWINUXCMD_ENABLE_RUST2=ON ^
            -DBUILD_MODE=RELEASE ^
            -DUSE_STATIC_CRT=ON ^
            -DENABLE_TESTS=${{ matrix.package_arch == 'x64' && matrix.edition == 'default' && 'ON' || 'OFF' }} ^
            -DCMAKE_CXX_STANDARD=23 ^
            -DCMAKE_CXX_STANDARD_REQUIRED=ON ^
            -DCMAKE_EXPERIMENTAL_CXX_MODULE_STD=ON ^
            -DCMAKE_CXX_MODULE_STD=ON ^
            -DCMAKE_CXX_FLAGS="/std:c++latest /EHsc"

      - name: Build Project
        shell: cmd
        working-directory: build-${{ matrix.package_arch }}
        run: |
          call "${{ steps.locate_vcvars.outputs.vcvars_path }}" ${{ matrix.vcvars_arg }}
          cmake --build . --config Release --parallel %NUMBER_OF_PROCESSORS%

      # One greppable line stating the WINUXCMD_ENABLE_RUST2 state of this
      # leg, plus a marker file uploaded with the packages that the
      # rust2-surface-check job compares across x64/arm64. The configure
      # above passes -DWINUXCMD_ENABLE_RUST2=ON explicitly, so CMake would
      # have already FATAL_ERROR'd without cargo; this step additionally
      # proves the per-triple staticlib actually landed (#1553: the lib
      # lives in the per-triple directory, never at rust2-target/release).
      - name: Record rust2 build surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = "${{ matrix.package_arch }}"
          $triple = if ($arch -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          $lib = "build-$arch/rust2-target/$triple/release/winuxcmd_ffi.lib"
          if (-not (Test-Path $lib)) {
            Write-Host "::error::WINUXCMD_ENABLE_RUST2 surface missing ($lib). CI builds must carry the rust2 command library; the replaced commands (true;false) do not exist without it."
            exit 1
          }
          $rustc = (& "$env:USERPROFILE\.cargo\bin\rustc.exe" --version).Trim()
          Write-Host "RUST2_STATUS=ON (true;false) arch=$arch triple=$triple toolchain=${{ env.RUST2_TOOLCHAIN }} $rustc"
          @(
            "rust2=ON",
            "commands=true;false",
            "arch=$arch",
            "triple=$triple",
            "toolchain=${{ env.RUST2_TOOLCHAIN }}",
            "rustc=$rustc"
          ) | Set-Content -Path "build-$arch/rust2-build-status-$arch.txt" -Encoding ascii

      # PGO (default x64 only): profile collection must run the instrumented
      # binary on the host arch, so the cross-compiled arm64 jobs and the
      # full-edition job (same code, entry-set-only difference) stay non-PGO.
      - name: PGO instrumented build (x64)
        if: matrix.package_arch == 'x64' && matrix.edition == 'default'
        shell: cmd
        run: |
          call "${{ steps.locate_vcvars.outputs.vcvars_path }}" x64
          cmake -B build-x64-pgo-train ^
            -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CXX_COMPILER_TARGET=x64 ^
            -DWINUXCMD_PACKAGE_ARCH=x64 ^
            -DWINUXCMD_ENABLE_RUST2=ON ^
            -DBUILD_MODE=RELEASE ^
            -DUSE_STATIC_CRT=ON ^
            -DENABLE_TESTS=OFF ^
            -DCMAKE_CXX_STANDARD=23 ^
            -DCMAKE_CXX_STANDARD_REQUIRED=ON ^
            -DCMAKE_EXPERIMENTAL_CXX_MODULE_STD=ON ^
            -DCMAKE_CXX_MODULE_STD=ON ^
            -DCMAKE_CXX_FLAGS="/std:c++latest /EHsc" ^
            -DWINUXCMD_PGO_INSTRUMENT=ON
          cmake --build build-x64-pgo-train --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: PGO collect profile (x64)
        if: matrix.package_arch == 'x64' && matrix.edition == 'default'
        shell: pwsh
        run: |
          $profileDir = Join-Path $PWD "build-x64-pgo-train\pgo"
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          $env:VCPROFILE_PATH = $profileDir
          # The instrumented binary needs pgort140.dll (VC PGO runtime).
          $pgRt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter pgort140.dll -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $pgRt) { throw "pgort140.dll not found" }
          $env:PATH = "$(Split-Path $pgRt.FullName);$env:PATH"
          & bash scripts/pgo-train.sh (Join-Path $PWD "build-x64-pgo-train\usr\bin")
          if ($LASTEXITCODE -ne 0) { throw "training workloads failed" }
          Get-ChildItem $profileDir -Filter *.pgc | Where-Object { $_.Length -eq 0 } | Remove-Item
          $pgc = Get-ChildItem $profileDir -Filter *.pgc
          if (-not $pgc) { throw "no .pgc profile data collected; training did not run" }
          Write-Host ("collected {0} .pgc file(s), {1:N1} MB total" -f $pgc.Count, (($pgc | Measure-Object Length -Sum).Sum / 1MB))
          Copy-Item (Join-Path $PWD "build-x64-pgo-train\winuxcmd.pgd") $profileDir -Force

      - name: PGO rebuild with profile (x64)
        if: matrix.package_arch == 'x64' && matrix.edition == 'default'
        shell: cmd
        run: |
          call "${{ steps.locate_vcvars.outputs.vcvars_path }}" x64
          cmake -B build-x64 ^
            -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CXX_COMPILER_TARGET=x64 ^
            -DWINUXCMD_PACKAGE_ARCH=x64 ^
            -DWINUXCMD_ENABLE_RUST2=ON ^
            -DBUILD_MODE=RELEASE ^
            -DUSE_STATIC_CRT=ON ^
            -DENABLE_TESTS=ON ^
            -DCMAKE_CXX_STANDARD=23 ^
            -DCMAKE_CXX_STANDARD_REQUIRED=ON ^
            -DCMAKE_EXPERIMENTAL_CXX_MODULE_STD=ON ^
            -DCMAKE_CXX_MODULE_STD=ON ^
            -DCMAKE_CXX_FLAGS="/std:c++latest /EHsc" ^
            -DWINUXCMD_PGO_USE=ON
          copy /Y build-x64-pgo-train\pgo\*.pgc build-x64\ >NUL
          copy /Y build-x64-pgo-train\pgo\winuxcmd.pgd build-x64\ >NUL
          cmake --build build-x64 --config Release --parallel %NUMBER_OF_PROCESSORS%

      # Parallel ctest flakes (0xc0000409 fail-fast / env-sensitive asserts,
      # #1260) are absorbed by re-running only the failed tests serially once
      # via scripts/ctest-gate.ps1; a test that also fails serially still reds.
      - name: Run Unit Tests (ctest)
        if: matrix.package_arch == 'x64' && matrix.edition == 'default'
        shell: cmd
        working-directory: build-${{ matrix.package_arch }}
        run: |
          call "${{ steps.locate_vcvars.outputs.vcvars_path }}" ${{ matrix.vcvars_arg }}
          powershell -NoProfile -ExecutionPolicy Bypass -File ..\scripts\ctest-gate.ps1 -BuildDir . -Configuration Release -TimeoutSeconds 120
          if errorlevel 1 exit /b 1

      - name: Package with CPack (7Z + ZIP + TGZ)
        shell: cmd
        working-directory: build-${{ matrix.package_arch }}
        run: |
          REM Package all components (Runtime + Documentation)
          cpack -G 7Z -C Release
          cpack -G ZIP -C Release
          cpack -G TGZ -C Release

      - name: Rename Packages
        shell: cmd
        run: |
          set "VER=${{ steps.extract_version.outputs.project_version }}"
          set "ARCH=${{ matrix.package_arch }}"
          set "BUILD_DIR=build-%ARCH%"
          REM The full edition keeps its "-full" qualifier in the asset name
          REM (#1438); CPack already bakes the suffix into the file name, the
          REM rename normalizes the version part either way.
          set "SUFFIX="
          if "${{ matrix.edition }}"=="full" set "SUFFIX=-full"

          REM Rename Runtime packages
          for %%f in ("%BUILD_DIR%\WinuxCmd-*.7z") do ren "%%f" "WinuxCmd-%VER%-win-%ARCH%%SUFFIX%.7z"
          for %%f in ("%BUILD_DIR%\WinuxCmd-*.zip") do ren "%%f" "WinuxCmd-%VER%-win-%ARCH%%SUFFIX%.zip"
          for %%f in ("%BUILD_DIR%\WinuxCmd-*.tar.gz") do ren "%%f" "WinuxCmd-%VER%-win-%ARCH%%SUFFIX%.tar.gz"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WinuxCmd-${{ steps.extract_version.outputs.project_version }}-${{ matrix.package_arch }}${{ matrix.edition == 'full' && '-full' || '' }}
          path: |
            build-${{ matrix.package_arch }}/WinuxCmd-${{ steps.extract_version.outputs.project_version }}-win-${{ matrix.package_arch }}.7z
            build-${{ matrix.package_arch }}/WinuxCmd-${{ steps.extract_version.outputs.project_version }}-win-${{ matrix.package_arch }}.zip
            build-${{ matrix.package_arch }}/WinuxCmd-${{ steps.extract_version.outputs.project_version }}-win-${{ matrix.package_arch }}.tar.gz
            build-${{ matrix.package_arch }}/WinuxCmd-${{ steps.extract_version.outputs.project_version }}-win-${{ matrix.package_arch }}-full.7z
            build-${{ matrix.package_arch }}/WinuxCmd-${{ steps.extract_version.outputs.project_version }}-win-${{ matrix.package_arch }}-full.zip
            build-${{ matrix.package_arch }}/WinuxCmd-${{ steps.extract_version.outputs.project_version }}-win-${{ matrix.package_arch }}-full.tar.gz
            build-${{ matrix.package_arch }}/rust2-build-status-${{ matrix.package_arch }}.txt
          retention-days: 1
          if-no-files-found: error

      - name: Install Inno Setup
        if: github.ref_type == 'tag' && matrix.edition == 'default'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      # The #1438 ruling defines the installer for the default edition only;
      # full ships as archives under the "-full" asset names.
      - name: Build Installer
        if: github.ref_type == 'tag' && matrix.edition == 'default'
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 `
            -Root $env:GITHUB_WORKSPACE `
            -BuildDir build-${{ matrix.package_arch }} `
            -Configuration Release `
            -Generator Ninja `
            -Arch ${{ matrix.package_arch }} `
            -VsEnvScript "${{ steps.locate_vcvars.outputs.vcvars_path }}" `
            -IsccPath "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            -SkipBuild

      - name: Upload Installer Artifact
        if: github.ref_type == 'tag' && matrix.edition == 'default'
        uses: actions/upload-artifact@v7
        with:
          name: WinuxCmd-${{ steps.extract_version.outputs.project_version }}-${{ matrix.package_arch }}-installer
          path: |
            dist/WinuxCmd-${{ steps.extract_version.outputs.project_version }}-${{ matrix.package_arch }}-setup.exe
          retention-days: 1
          if-no-files-found: error

  # Rust unit tests (#1602): no workflow ever ran `cargo test`, so the
  # winux-cmds suite (529 tests, verified on X299) and the #1597
  # short_h_is_rejected_like_gnu nails once re-added had no CI guard —
  # ctest only ever ran the C++ gtest names. This job runs alongside the
  # ctest leg; its failure name-set is adjudicated separately from the
  # ctest baseline cluster.
  rust-tests:
    runs-on: windows-2025
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Same pin as build-windows (RUST2_TOOLCHAIN 1.99.1): the test
      # binaries link against the MSVC host toolchain, so the suite must
      # run on exactly the toolchain the product ships.
      - name: Cache pinned rust2 toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/1.99.1-x86_64-pc-windows-msvc
          key: rustup-toolchain-${{ runner.os }}-${{ env.RUST2_TOOLCHAIN }}-msvc

      - name: Set up pinned Rust toolchain (rust2)
        shell: cmd
        run: |
          "%USERPROFILE%\.cargo\bin\rustup.exe" toolchain install %RUST2_TOOLCHAIN% --profile minimal --no-self-update
          "%USERPROFILE%\.cargo\bin\rustup.exe" default %RUST2_TOOLCHAIN%
          "%USERPROFILE%\.cargo\bin\rustup.exe" show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-rust2-${{ runner.os }}-${{ env.RUST2_TOOLCHAIN }}-${{ hashFiles('rust2/Cargo.lock', 'rust2/crates/*/Cargo.toml') }}

      # The verified set only: `cargo test -p winux-cmds` (529 tests on
      # X299, #1597). The workspace's other crates are not run here until
      # their suites are verified green the same way. The differential
      # gate (run-gate.sh) is wired in separately, in the rust2-gate job
      # below (#1616); the `bash -n` parse check above stays as the
      # build-leg syntax guard.
      # --no-fail-fast so a red run reports the full failure name-set.
      - name: Run Rust unit tests (cargo test)
        shell: cmd
        working-directory: rust2
        run: |
          "%USERPROFILE%\.cargo\bin\cargo.exe" test --locked --no-fail-fast -p winux-cmds

  # Differential gate execution (#1616): no workflow ever ran
  # rust2/gate/run-gate.sh, so the gate TSV rows — notably the
  # csplit/pathchk/ptx corpus PR #1613 left out of the ctest port — had
  # no CI execution path at all. This job runs the affected-command
  # subset on a hosted Windows runner (93 rows, measured ~1 min on X299):
  #   * GNU leg: WSL Ubuntu installed here — the windows-2025 image only
  #     ENABLES the WSL feature but ships no distro
  #     (actions/runner-images#11265); the job fails loudly if the distro
  #     never comes up rather than scoring vacuous MISSING-vs-MISSING
  #     green.
  #   * Rust leg: winuxcmd-driver built from the pinned toolchain
  #     (RUST_BIN default path rust2/target/debug/winuxcmd-driver.exe).
  #   * CPP leg: the Release dispatcher extracted from the build-windows
  #     x64 runtime package (job dependency below) — the same value model
  #     the local build-vs/usr/bin Debug exe serves; the edition split
  #     only materializes entry links, not the dispatcher, so the
  #     non-full package is used.
  # The full 1335+190 corpus stays a local/X299 tool; this slice is the
  # CI-sized affected subset the issue asks to gate.
  rust2-gate:
    runs-on: windows-2025
    needs: build-windows
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download x64 runtime package (CPP gate side)
        uses: actions/download-artifact@v8
        with:
          pattern: WinuxCmd-*-x64
          path: pkgs

      - name: Locate CPP dispatcher exe
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkgs -Recurse -Filter *-win-x64.zip |
            Where-Object { $_.Name -notmatch '-full' } |
            Select-Object -First 1
          if (-not $zip) { throw 'x64 runtime package zip not found' }
          Expand-Archive $zip.FullName -DestinationPath cppside
          $exe = Get-ChildItem cppside -Recurse -Filter winuxcmd.exe |
            Select-Object -First 1
          if (-not $exe) { throw 'winuxcmd.exe not found in package' }
          "CPP_BIN=$($exe.FullName)" >> $env:GITHUB_ENV

      # Same pin as rust-tests (RUST2_TOOLCHAIN 1.99.1): the driver must
      # exercise the library semantics the shipped product carries.
      - name: Cache pinned rust2 toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/1.99.1-x86_64-pc-windows-msvc
          key: rustup-toolchain-${{ runner.os }}-${{ env.RUST2_TOOLCHAIN }}-msvc

      - name: Set up pinned Rust toolchain (rust2)
        shell: cmd
        run: |
          "%USERPROFILE%\.cargo\bin\rustup.exe" toolchain install %RUST2_TOOLCHAIN% --profile minimal --no-self-update
          "%USERPROFILE%\.cargo\bin\rustup.exe" default %RUST2_TOOLCHAIN%
          "%USERPROFILE%\.cargo\bin\rustup.exe" show

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-rust2-${{ runner.os }}-${{ env.RUST2_TOOLCHAIN }}-${{ hashFiles('rust2/Cargo.lock', 'rust2/crates/*/Cargo.toml') }}

      - name: Build gate Rust side (winuxcmd-driver)
        shell: cmd
        working-directory: rust2
        run: |
          "%USERPROFILE%\.cargo\bin\cargo.exe" build --locked -p winuxcmd-driver

      # The image ships the WSL feature without a distro; install Ubuntu
      # (the gate's GNU oracle is the distro's coreutils) and wait for
      # first-launch registration to settle. `wsl --update` has been
      # observed to 403 on hosted runners (actions/runner-images#10563),
      # so a failed update is non-fatal as long as the distro itself
      # comes up.
      - name: Install WSL Ubuntu (GNU gate side)
        shell: pwsh
        run: |
          wsl --set-default-version 2
          wsl --update
          if ($LASTEXITCODE -ne 0) { Write-Host 'wsl --update failed (non-fatal); continuing' }
          wsl --install -d Ubuntu --no-launch
          if ($LASTEXITCODE -ne 0) { throw "wsl --install -d Ubuntu failed ($LASTEXITCODE)" }
          $ok = $false
          foreach ($i in 1..5) {
            wsl -d Ubuntu -u root -- sh -c 'echo wsl-ready'
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "WSL not ready (attempt $i); retrying in 15s"
            Start-Sleep -Seconds 15
          }
          if (-not $ok) { throw 'WSL Ubuntu did not come up after 5 attempts' }

      - name: Run differential gate (csplit pathchk ptx)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p rust2/target/gate
          bash rust2/gate/run-gate.sh csplit pathchk ptx | tee rust2/target/gate/summary.txt

      - name: Upload gate ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust2-gate-ledger
          path: |
            rust2/target/gate/ledger.tsv
            rust2/target/gate/summary.txt
          retention-days: 1
          if-no-files-found: warn

  # Cross-arch Rust surface consistency (#1488): the x64 and arm64 legs
  # must carry the SAME rust2 command library. The arm64 binary cannot be
  # executed on the x64 runner (Windows does not emulate ARM64 on x64), so
  # parity is enforced on four layers instead:
  #   1. PE machine type of each shipped winuxcmd.exe (x64 0x8664 vs
  #      arm64 0xAA64) - both images really were built for their arch;
  #   2. the per-leg rust2-build-status-<arch>.txt markers (rust2=ON, same
  #      command set, same pinned toolchain and rustc) are equal apart
  #      from the arch fields - neither leg lost or degraded rust2;
  #   3. the x64 exe actually dispatches the replaced commands: exit
  #      codes of true/false and true --version/false --version must be
  #      0/1/0/1 (GNU rule, coreutils true.c: --version honored as the
  #      sole argument, false keeps EXIT_STATUS 1 - the same rule the
  #      rust2 gate pins in rust2/gate/cases/{true,false}.tsv);
  #   4. no stray rust2/toolchain files (winuxcmd_ffi lib, rlib/rmeta,
  #      pdb) leak into the packages: the staticlib is folded into
  #      winuxcmd.exe at link time, so there is nothing to distribute.
  # Behavioral parity of the arm64 slice itself is gate-covered
  # (rust2/gate run under emulation-free differential testing); a native
  # arm64 behavioral probe would need a windows-11-arm runner and can
  # replace layer 3's arch asymmetry later without changing the contract.
  rust2-surface-check:
    runs-on: windows-2025
    needs: build-windows
    steps:
      - name: Download x64 packages
        uses: actions/download-artifact@v8
        with:
          pattern: WinuxCmd-*-x64
          path: pkgs

      - name: Download arm64 packages
        uses: actions/download-artifact@v8
        with:
          pattern: WinuxCmd-*-arm64
          path: pkgs

      - name: Compare Rust surfaces (x64 vs arm64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $x64Zip  = (Get-ChildItem pkgs -Recurse -Filter *-win-x64.zip   | Select-Object -First 1).FullName
          $armZip  = (Get-ChildItem pkgs -Recurse -Filter *-win-arm64.zip | Select-Object -First 1).FullName
          if (-not $x64Zip) { throw 'x64 package zip not found' }
          if (-not $armZip) { throw 'arm64 package zip not found' }
          Expand-Archive $x64Zip -DestinationPath ex-x64
          Expand-Archive $armZip -DestinationPath ex-arm64

          function Get-PEMachine([string]$path) {
            $fs = [System.IO.File]::OpenRead($path)
            try {
              $br = New-Object System.IO.BinaryReader($fs)
              $fs.Seek(0x3C, [System.IO.SeekOrigin]::Begin) | Out-Null
              $peOff = $br.ReadInt32()
              $fs.Seek($peOff, [System.IO.SeekOrigin]::Begin) | Out-Null
              if ($br.ReadUInt32() -ne 0x00004550) { throw "not a PE image: $path" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }

          $x64Exe = (Get-ChildItem ex-x64   -Recurse -Filter winuxcmd.exe | Select-Object -First 1).FullName
          $armExe = (Get-ChildItem ex-arm64 -Recurse -Filter winuxcmd.exe | Select-Object -First 1).FullName
          $x64Machine = Get-PEMachine $x64Exe
          $armMachine = Get-PEMachine $armExe
          Write-Host ("PE machine: x64=0x{0:X4} arm64=0x{1:X4}" -f $x64Machine, $armMachine)
          if ($x64Machine -ne 0x8664) { throw ("x64 winuxcmd.exe has wrong PE machine 0x{0:X4}" -f $x64Machine) }
          if ($armMachine -ne 0xAA64) { throw ("arm64 winuxcmd.exe has wrong PE machine 0x{0:X4}" -f $armMachine) }

          # Per-arch marker names: download-artifact@v8 extracts
          # pattern-matched artifacts flat into `path`, so a shared marker
          # name would collide/overwrite across the two downloads.
          Get-ChildItem pkgs -Recurse | ForEach-Object { Write-Host "pkgs: $($_.FullName)" }
          $x64Marker = (Get-ChildItem pkgs -Recurse -Filter rust2-build-status-x64.txt | Select-Object -First 1).FullName
          $armMarker = (Get-ChildItem pkgs -Recurse -Filter rust2-build-status-arm64.txt | Select-Object -First 1).FullName
          if (-not $x64Marker) { throw 'x64 rust2-build-status-x64.txt marker not found' }
          if (-not $armMarker) { throw 'arm64 rust2-build-status-arm64.txt marker not found' }
          $x64M = @{}
          $armM = @{}
          Get-Content $x64Marker | ForEach-Object { $k, $v = $_ -split '=', 2; $x64M[$k] = $v }
          Get-Content $armMarker | ForEach-Object { $k, $v = $_ -split '=', 2; $armM[$k] = $v }
          if ($x64M['rust2'] -ne 'ON') { throw "x64 leg did not build rust2: rust2=$($x64M['rust2'])" }
          foreach ($key in 'commands', 'toolchain', 'rustc') {
            if ($x64M[$key] -ne $armM[$key]) {
              throw "rust2 surface mismatch across arches: $key x64='$($x64M[$key])' arm64='$($armM[$key])'"
            }
          }

          # GNU exit-code contract (true.c / false.c, sole-argument rule)
          & $x64Exe true  *> $null; $trueRc = $LASTEXITCODE
          & $x64Exe false *> $null; $falseRc = $LASTEXITCODE
          & $x64Exe true  --version *> $null; $trueVersionRc = $LASTEXITCODE
          & $x64Exe false --version *> $null; $falseVersionRc = $LASTEXITCODE
          Write-Host "x64 behavior: true=$trueRc false=$falseRc true --version=$trueVersionRc false --version=$falseVersionRc"
          if ($trueRc -ne 0)          { throw "true exited $trueRc, expected 0" }
          if ($falseRc -ne 1)         { throw "false exited $falseRc, expected 1" }
          if ($trueVersionRc -ne 0)   { throw "true --version exited $trueVersionRc, expected 0" }
          if ($falseVersionRc -ne 1)  { throw "false --version exited $falseVersionRc, expected 1" }

          # Packaging guard (#1488): the staticlib is folded into
          # winuxcmd.exe by the same link run - nothing rust2-shaped may
          # ship as a separate file.
          $stray = Get-ChildItem ex-x64, ex-arm64 -Recurse -File |
            Where-Object { $_.Name -match 'winuxcmd_ffi|rust2|\.rlib$|\.rmeta$|\.pdb$' }
          if ($stray) { throw ("stray rust2/toolchain files in packages: " + ($stray.FullName -join ', ')) }

          Write-Host "RUST2 SURFACE CHECK: consistent - x64 0x8664 + arm64 0xAA64, rust2=ON, commands=$($x64M['commands']), toolchain=$($x64M['toolchain']), $($x64M['rustc'])"
          # pwsh propagates the LAST native command's $LASTEXITCODE as the step
          # result; the probe helpers (rustc queries, file tests) can leave a
          # stale 1 behind even when every assertion above passed. Pin success.
          exit 0

  release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - rust2-surface-check
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: write

    outputs:
      version: ${{ steps.final_version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Extract Version from Tag
        id: final_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download x64 Packages
        uses: actions/download-artifact@v8
        with:
          name: WinuxCmd-${{ steps.final_version.outputs.version }}-x64
          path: artifacts/x64

      - name: Download ARM64 Packages
        uses: actions/download-artifact@v8
        with:
          name: WinuxCmd-${{ steps.final_version.outputs.version }}-arm64
          path: artifacts/arm64

      - name: Download x64 Full Packages
        uses: actions/download-artifact@v8
        with:
          name: WinuxCmd-${{ steps.final_version.outputs.version }}-x64-full
          path: artifacts/x64-full

      - name: Download ARM64 Full Packages
        uses: actions/download-artifact@v8
        with:
          name: WinuxCmd-${{ steps.final_version.outputs.version }}-arm64-full
          path: artifacts/arm64-full

      - name: Download x64 Installer
        uses: actions/download-artifact@v8
        with:
          name: WinuxCmd-${{ steps.final_version.outputs.version }}-x64-installer
          path: artifacts/installers/x64

      - name: Download ARM64 Installer
        uses: actions/download-artifact@v8
        with:
          name: WinuxCmd-${{ steps.final_version.outputs.version }}-arm64-installer
          path: artifacts/installers/arm64

      - name: Verify Packages
        run: |
          echo "=== Valid Packages ==="
          find artifacts -type f \( -name "*.7z" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" \) | sort || exit 1
          echo "======================"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/x64/*.7z
            artifacts/x64/*.zip
            artifacts/x64/*.tar.gz
            artifacts/arm64/*.7z
            artifacts/arm64/*.zip
            artifacts/arm64/*.tar.gz
            artifacts/x64-full/*.7z
            artifacts/x64-full/*.zip
            artifacts/x64-full/*.tar.gz
            artifacts/arm64-full/*.7z
            artifacts/arm64-full/*.zip
            artifacts/arm64-full/*.tar.gz
            artifacts/installers/x64/*.exe
            artifacts/installers/arm64/*.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Windows binaries for ${{ github.ref_name }}
            
            ### Architectures:
            - **x64**: Windows 64-bit
            - **ARM64**: Windows ARM64 (cross-compiled)
            
            ### Full-only commands (edition split, #1438):
            The default edition does not create entry links for **`[`**, **`env`**, **`false`**, **`kill`**, **`test`**, **`time`**, **`true`** — these commands' user-facing semantics are defined by your host shell's builtins (`winuxcmd <name> ...` still works). The full edition materializes every entry and ships under the `-full` asset names; it is **not** distributed through wpm:
            - WinuxCmd-${{ steps.final_version.outputs.version }}-win-x64-full.7z / .zip / .tar.gz
            - WinuxCmd-${{ steps.final_version.outputs.version }}-win-arm64-full.7z / .zip / .tar.gz
            
            ### Files included:
            - WinuxCmd-${{ steps.final_version.outputs.version }}-win-x64.7z / .zip / .tar.gz
            - WinuxCmd-${{ steps.final_version.outputs.version }}-x64-setup.exe
            - WinuxCmd-${{ steps.final_version.outputs.version }}-win-arm64.7z / .zip / .tar.gz
            - WinuxCmd-${{ steps.final_version.outputs.version }}-arm64-setup.exe
            - WinuxCmd-skill-v${{ steps.final_version.outputs.version }}.zip (AI agent skill bundle, attached separately)
            
            ### Package Contents:
            - `usr/bin/winuxcmd.exe` - Main executable (multi-call binary: one exe provides all commands)
            - `usr/bin/create_links.ps1` - Generates per-command links (hardlinks on NTFS, symlinks otherwise)
            - Environment and lifecycle scripts: `winux.ps1` / `winux.cmd` / `winux-activate.ps1`, `winuxcmd_init.cmd` / `winuxcmd_uninstall.cmd`
            - `README.md` / `README-ZH.md` / `LICENSE`
            
            ### Package Formats:
            - **7Z**: Best compression (requires 7-Zip)
            - **ZIP**: Native Windows support (right-click to extract)
            - **TGZ**: tar.gz format (use `tar -xzf filename.tar.gz`)
            - **EXE**: standalone installer with PATH and PowerShell integration tasks
            
            ### Usage:
            1. Download the appropriate package for your architecture
            2. Extract to your desired directory
            3. Navigate to the `usr/bin` directory
            4. Run `create_links.ps1` to generate command links
               ```powershell
               # For NTFS filesystems (recommended)
               .\create_links.ps1
               
               # For non-NTFS filesystems, use symbolic links
               .\create_links.ps1 -UseSymbolicLinks
               
               # To remove all links later
               .\create_links.ps1 -Remove
               ```
            5. Add the `usr\bin` directory to your PATH
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: 'true'
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-i18n-catalog:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    env:
      I18N_REPO_TOKEN: ${{ secrets.I18N_REPO_TOKEN }}
    permissions:
      contents: read
    steps:
      - name: Checkout WinuxCmd
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare English catalog
        shell: bash
        run: |
          python3 scripts/i18n_sync.py prepare --output artifacts/i18n

      - name: Check I18N token
        shell: bash
        run: |
          if [ -z "$I18N_REPO_TOKEN" ]; then
            echo "I18N_REPO_TOKEN is not configured; English catalog was prepared locally only."
            exit 0
          fi

      - name: Checkout I18N repository
        if: env.I18N_REPO_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: unixwin/winuxcmd-i18n
          token: ${{ env.I18N_REPO_TOKEN }}
          path: i18n-repo
          fetch-depth: 1

      - name: Sync catalog
        if: env.I18N_REPO_TOKEN != ''
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          BRANCH: automation/winuxcmd-${{ github.ref_name }}-i18n
        run: |
          python3 scripts/i18n_sync.py publish \
            --source artifacts/i18n \
            --repo i18n-repo \
            --version "$VERSION" \
            --branch "$BRANCH"
          export GH_TOKEN="$I18N_REPO_TOKEN"
          pr_url="$(gh pr list --repo unixwin/winuxcmd-i18n --head "$BRANCH" --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --repo unixwin/winuxcmd-i18n --base main --head "$BRANCH" \
              --title "Sync WinuxCmd ${VERSION} I18N catalog" \
              --body "Automated catalog sync for WinuxCmd ${VERSION}.")"
          fi
          gh pr merge "$pr_url" --repo unixwin/winuxcmd-i18n --squash --delete-branch || \
            gh pr merge "$pr_url" --repo unixwin/winuxcmd-i18n --squash --delete-branch --auto

  i18n-drift:
    # Drift detection for the published locale catalogs (issue #1127 P3):
    # extract the English catalog from this source and diff it against the
    # catalogs published in unixwin/winuxcmd-i18n. The diff must not grow
    # beyond scripts/i18n-drift-baseline.json, which records the standing
    # lag between master source and the reviewed translation batches, so
    # this job is green on master as it stands and turns red exactly when
    # a change adds source strings without their catalog sync (or a
    # catalog key breaks) - the drift this gate exists to catch. A
    # deliberate string change records its growth in the same PR via
    # scripts/check_i18n_drift.py --update-baseline.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout WinuxCmd
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Checkout I18N catalogs
        # Public repository; an anonymous read clone is all the check
        # needs (unlike sync-i18n-catalog, which pushes and therefore
        # uses the I18N_REPO_TOKEN secret).
        shell: bash
        run: git clone --depth 1 https://github.com/unixwin/winuxcmd-i18n.git i18n-repo
      - name: Extract and diff against the published catalogs
        shell: bash
        run: python3 scripts/check_i18n_drift.py --i18n-repo i18n-repo

  update-wpm-source-index:
    # Indexes the DEFAULT edition only (#1438): the full edition is a
    # standalone asset family ("-full" names) and must never enter the wpm
    # index. Entry links are not listed here either - `wpm links rebuild`
    # derives them from the shipped binary itself, so the index, the niu
    # bundle pin and the binary share the one edition definition in
    # src/core/package_edition.h.
    runs-on: ubuntu-latest
    needs: release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')

    steps:
      - name: Verify wpm-source token
        shell: bash
        env:
          WPM_SOURCE_TOKEN: ${{ secrets.WPM_SOURCE_TOKEN }}
        run: |
          if [ -z "${WPM_SOURCE_TOKEN}" ]; then
            echo "::error::Set WPM_SOURCE_TOKEN to a token with write access to unixwin/wpm-source."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout WPM Source
        uses: actions/checkout@v6
        with:
          repository: unixwin/wpm-source
          token: ${{ secrets.WPM_SOURCE_TOKEN }}
          path: wpm-source
          fetch-depth: 1

      - name: Download x64 Packages
        uses: actions/download-artifact@v8
        with:
          name: WinuxCmd-${{ needs.release.outputs.version }}-x64
          path: artifacts/x64

      - name: Download ARM64 Packages
        uses: actions/download-artifact@v8
        with:
          name: WinuxCmd-${{ needs.release.outputs.version }}-arm64
          path: artifacts/arm64

      - name: Update WPM source index
        shell: pwsh
        run: |
          ./.github/scripts/update-wpm-source-index.ps1 `
            -IndexPath "wpm-source/index.json" `
            -Version "${{ needs.release.outputs.version }}" `
            -X64ZipPath "artifacts/x64/WinuxCmd-${{ needs.release.outputs.version }}-win-x64.zip" `
            -Arm64ZipPath "artifacts/arm64/WinuxCmd-${{ needs.release.outputs.version }}-win-arm64.zip" `
            -ReleaseTag "${{ github.ref_name }}"

      - name: Create and merge wpm-source PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WPM_SOURCE_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          cd wpm-source
          if git diff --quiet -- index.json; then
            echo "wpm-source index already matches WinuxCmd ${VERSION}."
            exit 0
          fi

          branch="automation/winuxcmd-${VERSION}-index"
          title="Update WinuxCmd package index to ${VERSION}"
          body="Automated update from unixwin/WinuxCmd release v${VERSION}."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add index.json
          git commit -m "${title}"
          git push --force-with-lease origin "${branch}"

          pr_url="$(gh pr list --repo unixwin/wpm-source --head "${branch}" --state open --json url --jq '.[0].url')"
          if [ -z "${pr_url}" ]; then
            pr_url="$(gh pr create --repo unixwin/wpm-source --base main --head "${branch}" --title "${title}" --body "${body}")"
          fi

          gh pr merge "${pr_url}" --repo unixwin/wpm-source --squash --delete-branch ||
            gh pr merge "${pr_url}" --repo unixwin/wpm-source --squash --delete-branch --auto

  cache-and-notify:
    runs-on: windows-2025
    needs:
      - release
      - update-wpm-source-index
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')  # Only run on tag releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Refresh WinuxCmd Server Cache
        id: refresh-cache
        continue-on-error: true  # Cache refresh failure won't break the job
        env:
          CACHE_REFRESH_TOKEN: ${{ secrets.CACHE_REFRESH_TOKEN }}
        run: |
          .\.github\scripts\refresh-cache.ps1
        shell: pwsh

      - name: Send Notification
        id: notify
        continue-on-error: true  # Notification failure won't break the job
        env:
          CACHE_RESULT: ${{ steps.refresh-cache.outputs.cache-refresh-result || 'skipped' }}
          CACHE_MESSAGE: ${{ steps.refresh-cache.outputs.cache-message || '' }}
          CACHE_ERROR: ${{ steps.refresh-cache.outputs.cache-error || '' }}
          VERSION: ${{ needs.release.outputs.version || '' }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          .\.github\scripts\notify-cache-result.ps1 `
            -Result "$env:CACHE_RESULT" `
            -Message "$env:CACHE_MESSAGE" `
            -Error "$env:CACHE_ERROR" `
            -Version "$env:VERSION" `
            -TagName "$env:TAG_NAME"
        shell: pwsh
